[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PIP_EXTRA_INDEX_URL = "https://pypi.ngc.nvidia.com https://download.pytorch.org/whl/cu121"

[tool.hatch.metadata]
# for git-referenced dependencies
allow-direct-references = true

[project]
name = "sam3d_objects"
version = "0.0.1"
# required for "hatch-requirements-txt" to work
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.build]
ignore-vcs = true
include = ["**/*.py"]
exclude = ["conftest.py", "*_test.py"]
packages = ["sam3d_objects", "sam3_masking", "sam3_route"]

[project.scripts]
sam3-prepare = "sam3_masking.cli_prepare:main"
sam3-mask = "sam3_masking.cli_mask:main"
sam3d-prompt-to-mesh = "sam3_masking.mesh_bridge:main"
sam3-mask-route = "sam3_route.batch_segment:main"
sam3d-ouster-route = "sam3_route.cli:main"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
p3d = ["requirements.p3d.txt"]
inference = ["requirements.inference.txt"]
dev = ["requirements.dev.txt"]
sam3 = ["requirements.sam3.txt"]
ouster = ["requirements.ouster.txt"]

[tool.pytest.ini_options]
markers = [
  "gpu: opt-in tests requiring CUDA and local model checkpoints",
]
